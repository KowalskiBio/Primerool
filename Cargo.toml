[workspace]
resolver = "2"
members = [
    "crates/thermo-core",
    "crates/primer3-sys",
    "crates/primer3-ffi",
    "crates/engine",
    "crates/providers",
    "crates/blast",
    "crates/align",
    "crates/idt",
    "crates/server",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Vojtech Rejtar <rejtarv@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
async-trait = "0.1"
