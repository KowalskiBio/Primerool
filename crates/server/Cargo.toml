[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "axum HTTP/JSON server replicating Primerool's Flask API surface. Routing/validation/shaping only — no business logic lives here."

[[bin]]
name = "primerool-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
engine = { path = "../engine" }
thermo-core = { path = "../thermo-core" }
primer3-ffi = { path = "../primer3-ffi" }
providers = { path = "../providers" }
blast = { path = "../blast" }
align = { path = "../align" }
idt = { path = "../idt" }
reqwest.workspace = true
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
