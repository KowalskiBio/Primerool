<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primerool</title>
    <script>
      // Applied before React mounts, so there's no flash of the wrong
      // theme/density on load — mirrors the legacy app's own inline
      // pre-mount script, same localStorage keys ('theme', 'density') for
      // continuity with any already-populated origin storage.
      (function () {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var density = localStorage.getItem('density') || 'airy';
        document.documentElement.setAttribute('data-density', density);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
